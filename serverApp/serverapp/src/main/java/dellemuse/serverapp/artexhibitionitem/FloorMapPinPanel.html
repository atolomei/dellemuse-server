<wicket:panel>

	<div class="row">
		<div class="mb-4 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 text-center text-lg-start text-xl-start text-xxl-start">


			<div class="row">
				<div
					class="col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 text-center text-lg-start text-xl-start text-xxl-start">

					<div wicket:id="mapContainer">
						<div class="mb-2 text-muted small">
							<wicket:message key="map-pin-help" />
						</div>

						<div class="position-relative d-inline-block w-100">

							<img wicket:id="mapImage" class="img-fluid rounded border w-100" style="display: block;" alt="Floor map" />

							<!-- Pin marker positioned absolutely over the image -->
							<div wicket:id="pin" class="position-absolute text-primary" style="pointer-events: none; font-size: 2rem;">
								<i class="fa-solid fa-map-pin fs-4"></i> 
							</div>

						</div>

						<div class="mt-1 mb-3 w-100 ">

							<a wicket:id="clearPin" href="#" style="float: left;" class="btn-link"> <wicket:message key="clear-pin" />
							</a> <span style="float: right;" class="f-e badge text-bg-secondary" wicket:id="coords"></span>

						</div>
					</div>
				</div>
			</div>

			<div wicket:id="noMap" class="row text-muted   small">
				<div
					class="col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 text-center text-lg-start text-xl-start text-xxl-start">
					<wicket:message key="no-floor-map" />
				</div>

			</div>
		</div>
	</div>

</wicket:panel>
